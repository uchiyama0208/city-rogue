<body>
<main id="app">
<header><div class="logo"><svg viewBox="0 0 30 36" aria-hidden="true"><path d="M3 32V20h4v12M13 32V5h4v27M23 32V12h4v20" stroke-width="5"/></svg><div><h1>CITY <span>ROGUE</span></h1><div class="tag">街をつくる、連鎖をつくる。</div></div></div><div class="tools"><button id="sound" aria-label="効果音の切り替え">♪</button><button id="night" aria-label="昼夜の切り替え">☾</button><button id="help" aria-label="遊び方">?</button><button id="reset" aria-label="新しい街">↻</button></div></header>

<script>
(() => {
'use strict';
const $=id=>document.getElementById(id), KEY='city-rogue-chat-v2', N=9;
window.addEventListener('error',e=>{ $('boot').hidden=false;$('boot').textContent='起動エラー：'+(e.message||'ページを再読み込みしてください。'); });
const B={
 road:{name:'道路',cost:5,base:0,col:'#bed0cb',desc:'役場と建物を接続。行動力は不要です。',icon:'M7 2 3 22M17 2l4 20M12 3v3m0 4v4m0 4v3'},
 home:{name:'住宅',cost:26,base:6,col:'#f3b78f',desc:'人口+8。隣接公園1つにつき収益+50%。',icon:'m3 10 9-7 9 7v11h-6v-7H9v7H3z'},
 market:{name:'商店',cost:38,base:10,col:'#f0d28b',desc:'隣接する稼働住宅1軒につき収益+4。',icon:'M4 10v11h16V10M3 10l2-7h14l2 7zM9 21v-6h6v6M8 3l-1 7m9-7 1 7'},

 bank:{name:'銀行',cost:70,base:12,col:'#aec5ec',desc:'所持金50ごとに収益+3。最大+30。',icon:'m3 8 9-5 9 5zM3 21h18M4 18h16M6 8v10m4-10v10m4-10v10m4-10v10'},

};
const P=[
 ['green','緑のある暮らし','公園に隣接する住宅の収益を、さらに×2。','park'],
 ['shop','商業特区','すべての商店の収益×1.8。','market'],
 ['density','眠らない街','稼働中の住宅6軒以上で都市倍率×1.8。','home'],
 ['mix','小さな大都市','稼働建物1種類につき都市倍率+0.12。','hall'],
 ['tax','高額納税都市','住宅収益×1.7。ただし幸福度−8。','bank'],
 ['forest','森と生きる','未開拓の森1マスにつき都市倍率+0.025。','park'],
 ['festival','四季の祝祭','4・8・12ターンの決算で都市倍率×1.8。','hotel'],
 ['industry','蒸気の時代','工場収益×2.2。工場の幸福度低下も2倍。','factory'],
 ['discount','建設ラッシュ','建設・改築費−25%。伐採費は対象外。','wind'],
 ['wealth','豊かな金庫','決算前の所持金150以上で都市倍率×1.6。','bank'],
 ['happy','幸福の連鎖','幸福度90以上で都市倍率×1.7。','park'],
 ['neighbor','ご近所経済','商店の隣接住宅ボーナスが+4から+10に。','market']
];
const EVENTS=[['穏やかな季節'],['開拓日和'],['青空マーケット','market',1.5],['第1回 都市審査'],['移住の季節','home',1.3],['観光シーズン','hotel',1.6],['追い風','wind',1.6],['産業振興の審査','factory',1.3],['消費の冷え込み','market',.7],['穏やかな季節'],['大観光祭','hotel',1.8],['最後の都市審査']];
const TARGETS=[220,850,2000], paths=k=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${B[k].icon}"/></svg>`, fmt=n=>Math.floor(n).toLocaleString('ja-JP');
const near=i=>{let x=i%N,y=Math.floor(i/N);return [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(([a,b])=>a>=0&&b>=0&&a<N&&b<N).map(([a,b])=>b*N+a);};
function fresh(){const seed=(Date.now()>>>0)||1;let g=[];let r=seed;const rand=()=>{r^=r<<13;r^=r>>>17;r^=r<<5;return(r>>>0)/4294967296;};for(let y=0;y<N;y++)for(let x=0;x<N;x++)g.push({t:x+y<2||(x>6&&y<2)||(y>6&&x<2)||(x===8&&y===8)?'water':rand()<.25?'forest':'grass',b:null,l:1,v:Math.floor(rand()*4)});for(let x=1;x<8;x++)g[4*N+x].b='road';for(let y=2;y<8;y++)g[y*N+4].b='road';for(let [x,y,b]of [[4,4,'hall'],[3,3,'home'],[5,3,'home'],[5,5,'market'],[3,5,'park']])g[y*N+x].b=b;g.forEach(t=>{if(t.b)t.t='grass';});return{v:2,seed,rng:r>>>0,g,cash:120,score:0,round:1,ap:4,policies:[],unlocked:['road','home','market','park'],phase:'build',offers:[],history:[],free:false};}
function valid(s){return s&&s.v===2&&Array.isArray(s.g)&&s.g.length===81&&s.g.every(t=>t&&['grass','water','forest'].includes(t.t)&&(!t.b||Object.hasOwn(B,t.b))&&[1,2,3].includes(t.l)&&[0,1,2,3].includes(t.v))&&s.g[40].b==='hall'&&s.g.filter(t=>t.b==='hall').length===1&&['cash','score','round','ap','rng'].every(k=>Number.isSafeInteger(s[k])&&s[k]>=0)&&s.round>0&&s.round<10000&&s.ap<=6&&s.cash<1e12&&s.score<1e15&&Array.isArray(s.policies)&&s.policies.length<=5&&new Set(s.policies).size===s.policies.length&&s.policies.every(id=>P.some(p=>p[0]===id))&&Array.isArray(s.unlocked)&&s.unlocked.every(id=>id!=='hall'&&Object.hasOwn(B,id))&&['build','reward','won','lost'].includes(s.phase)&&Array.isArray(s.offers)&&s.offers.length<=3&&s.offers.every(o=>o&&(o.kind==='cash'||o.kind==='ap'||o.kind==='policy'&&P.some(p=>p[0]===o.id)||o.kind==='blueprint'&&['factory','wind','hotel','bank'].includes(o.id)))&&(s.phase!=='reward'||s.offers.length===3)&&Array.isArray(s.history)&&s.history.length<10000&&s.history.every(n=>Number.isFinite(n)&&n>=0);}
let state=fresh();try{const saved=JSON.parse(localStorage.getItem(KEY));if(valid(saved))state=saved;}catch{}
let selected=-1,type='home',isNight=false,muted=true,busy=false,modalKind='',timer,view,frame=0,zoom=1,panX=0,panY=0,w=0,h=0,scale=1,ox=0,oy=0,particles=[],pops=new Map(),cars=[],audio;
const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches||false;
const has=id=>state.policies.includes(id), random=()=>{let x=state.rng|0;x^=x<<13;x^=x>>>17;x^=x<<5;state.rng=x>>>0;return state.rng/4294967296;};
function metrics(){const g=state.g,net=new Set([40]),queue=[40];for(let j=0;j<queue.length;j++)for(let i of near(queue[j]))if(!net.has(i)&&['road','hall'].includes(g[i].b)){net.add(i);queue.push(i);}let active=new Set(),count={},pop=0,parks=0,base=0,rows=[];for(let i=0;i<81;i++)if(g[i].b&&(net.has(i)||near(i).some(n=>net.has(n)))){active.add(i);count[g[i].b]=(count[g[i].b]||0)+1;if(g[i].b==='park')parks+=g[i].l;}

 if(!reduced)for(let c of cars){if(!view.net.has(c.i)){c.i=roads[0];c.to=null;}if(c.i===undefined)continue;if(c.to===null){const next=near(c.i).filter(j=>view.net.has(j)&&state.g[j].b==='road');if(!next.length)continue;c.to=next[Math.floor(Math.random()*next.length)];}c.t+=dt*.45;const x=(c.i%9)*(1-c.t)+(c.to%9)*c.t,y=Math.floor(c.i/9)*(1-c.t)+Math.floor(c.to/9)*c.t;box(x,y,.19,.12,3,[c.col,'#aeb9aa','#7e9994'],3);if(c.t>=1){c.i=c.to;c.to=null;c.t=0;}}
 for(let p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.text)p.vy+=50*dt;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;if(p.text){ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);}else ctx.fillRect(p.x,p.y,2.4,2.4);}particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;ctx.restore();if(isNight){ctx.fillStyle='#15214133';ctx.fillRect(0,0,w,h);}}
function loop(now){requestAnimationFrame(loop);if(document.hidden||now-frame<(reduced?100:32))return;const dt=Math.min(.08,(now-frame)/1000);frame=now;render(now,dt);}
const pointers=new Map();let gesture=null,dist=0;
const local=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
function zoomBy(f){zoom=Math.max(.8,Math.min(2.6,zoom*f));transform();}
function tap(x,y){if(busy||state.phase!=='build'||modalKind)return;const a=(x-ox)/scale,b=(y-oy)/scale,gx=Math.round(a/48+b/24),gy=Math.round(b/24-a/48);selected=gx>=0&&gx<9&&gy>=0&&gy<9?gy*9+gx:-1;placement();beep(330);}
canvas.addEventListener('pointerdown',e=>{if(e.button&&e.button!==0)return;const p=local(e);pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);if(pointers.size===1)gesture={start:p,last:p,moved:false};else{gesture.moved=true;let a=[...pointers.values()];dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!gesture)return;const p=local(e);pointers.set(e.pointerId,p);if(pointers.size>1){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(dist>1)zoomBy(d/dist);dist=d;}else{if(Math.hypot(p.x-gesture.start.x,p.y-gesture.start.y)>6)gesture.moved=true;if(gesture.moved){panX=Math.max(-w*.8,Math.min(w*.8,panX+p.x-gesture.last.x));panY=Math.max(-h*.8,Math.min(h*.8,panY+p.y-gesture.last.y));}gesture.last=p;}});
function end(e){const p=local(e);if(gesture&&!gesture.moved&&e.type==='pointerup')tap(p.x,p.y);pointers.delete(e.pointerId);if(pointers.size===1){gesture.last=[...pointers.values()][0];gesture.moved=true;}else if(!pointers.size)gesture=null;}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',e=>{pointers.delete(e.pointerId);if(!pointers.size)gesture=null;});canvas.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.1:1/1.1);},{passive:false});
$('cards').onclick=e=>{const b=e.target.closest('[data-type]');if(!b||busy||state.phase!=='build')return;if(!state.unlocked.includes(b.dataset.type))return toast('決算後に設計図を獲得すると建設できます。');type=b.dataset.type;selected=-1;refresh();};
$('selection').onclick=e=>{const b=e.target.closest('[data-action]');if(!b||state.phase!=='build'||busy)return;const a=b.dataset.action;if(a==='build')construct();if(a==='upgrade')upgrade();if(a==='remove'){const t=state.g[selected];if(!t?.b||t.b==='hall')return;modal('この建物を撤去しますか？',`<p>${B[t.b].name}を撤去し、資金${Math.floor(B[t.b].cost*.25)}を回収します。道路を撤去すると建物が未接続になる場合があります。</p>`,'<button class="secondary" data-action="close">戻る</button><button class="primary" data-action="remove-confirm">撤去する</button>');}};
$('modal').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.choice!==undefined)return choose(Number(b.dataset.choice));if(b.dataset.replace!==undefined)return choose(pending,Number(b.dataset.replace));switch(b.dataset.action){case'close':close();break;case'new':newGame();break;case'back':rewardScreen();break;case'skip':if(state.phase==='reward'){state.cash+=15;state.offers=[];state.phase='build';dismiss();selected=-1;refresh();}break;case'continue':state.free=true;state.round++;state.ap=4;state.phase='reward';offers();refresh();rewardScreen();break;case'remove-confirm':{const t=state.g[selected];if(t?.b&&t.b!=='hall'){state.cash+=Math.floor(B[t.b].cost*.25);t.b=null;t.l=1;cars=[];}dismiss();refresh();break;}}};
$('settle').onclick=settle;$('policies').onclick=infoPolicies;$('history').onclick=history;$('forecast').onclick=history;$('plus').onclick=()=>zoomBy(1.2);$('minus').onclick=()=>zoomBy(1/1.2);$('center').onclick=()=>{zoom=1;panX=panY=0;transform();};$('night').onclick=()=>{isNight=!isNight;$('night').textContent=isNight?'☀':'☾';};$('sound').onclick=()=>{muted=!muted;$('sound').style.color=muted?'#79939e':'#ace8c6';toast(muted?'効果音をオフにしました。':'効果音をオンにしました。');beep();};$('build-tab').onclick=()=>{selected=-1;placement();};
$('help').onclick=()=>modal('小さな街、大きな連鎖。','<p>① 建物を選び、土地をタップし「建設」で確定します。住宅と公園、商店と住宅を隣接させると収益が増えます。</p><p>② 1ターンの行動力は4。道路は行動力を消費しません。役場につながる道路に隣接しない建物は稼働しません。森には伐採費8が追加されます。</p><p>③ 「決算する」で収益と繁栄度を獲得。3択の条例・設計図・支援から1つ選びます。</p><p>4・8・12ターンの目標は累計220・850・2,000。条例の倍率を組み合わせて突破します。建物をタップすると改築できます。</p><p>保存できないプレビュー環境では、画面を閉じると進行が失われます。</p>',closeButton);
$('reset').onclick=()=>{if(busy)return;modal('新しい街を開拓しますか？','<p>現在の街の進行は上書きされます。</p>','<button class="secondary" data-action="close">戻る</button><button class="primary" data-action="new">新しく始める</button>');};
$('overlay').onclick=e=>{if(e.target===$('overlay'))close();};document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&!$('overlay').hidden){const buttons=[...$('modal').querySelectorAll('button:not(:disabled)')];if(!buttons.length)return;let first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe($('world'));document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
refresh();resize();render(performance.now(),0);$('boot').hidden=true;requestAnimationFrame(loop);if(state.phase==='reward')rewardScreen();if(['won','lost'].includes(state.phase))resultScreen();
window.CityRogue={state:()=>JSON.parse(JSON.stringify(state)),metrics,screen:i=>{transform();const [x,y]=point(i%9,Math.floor(i/9));return{x:ox+x*scale,y:oy+y*scale};}};
})();
