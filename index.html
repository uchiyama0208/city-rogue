 if(b==='home'||b==='hall'){const z=height+3;face([[x-.39,y-.4,z],[x+.39,y-.4,z],[x+.39,y,z+12],[x-.39,y,z+12]],b==='home'?'#e6a181':'#87bbb0');face([[x-.39,y,z+12],[x+.39,y,z+12],[x+.39,y+.4,z],[x-.39,y+.4,z]],b==='home'?'#c78570':'#5e948d');face([[x+.33,y-.33,z],[x+.33,y+.33,z],[x+.33,y,z+10]],'#e1c4a2');if(b==='hall'){box(x,y,.2,.2,13,['#c5dac8','#a0bcaf','#8aac9e'],height+7);line(point(x,y,height+20),point(x,y,height+34),'#d8dec2',1.1);face([[x,y,height+34],[x+.32,y,height+30],[x,y,height+26]],'#f0ce89');}}
 else{box(x,y,.74,.74,3,[cols[0],'#9faeaa','#859d99'],height+2);if(b==='market'){for(let a=0;a<5;a++)box(x-.3+a*.15,y+.35,.14,.23,2,a%2?['#f5e1ae','#dfd2a4','#c2b78f']:['#dda486','#b98871','#a87965'],height-1);}if(b==='factory'){box(x-.16,y-.15,.18,.18,19,['#c8c3c9','#9c9fab','#7d8798'],height+3);box(x+.18,y-.16,.15,.15,13,['#c8c3c9','#9c9fab','#7d8798'],height+3);for(let n=0;n<3;n++){let u=(now*.00035+n*.33)%1,[px,py]=point(x-.16+u*.25,y-.15,height+23+u*22);ctx.fillStyle=`rgba(220,227,215,${(1-u)*.22})`;ctx.beginPath();ctx.arc(px,py,2+u*5,0,7);ctx.fill();}}if(b==='wind'){const [px,py]=point(x,y,height+6);for(let a=0;a<4;a++){let ang=(reduced?0:now*.001)+a*Math.PI/2;line([px,py],[px+Math.cos(ang)*18,py+Math.sin(ang)*18],'#e9ead0',3.5);}ctx.fillStyle='#718f82';ctx.beginPath();ctx.arc(px,py,2.4,0,7);ctx.fill();}}

function burstAt(i,color,count=15,text=''){const [x,y]=point(i%9,Math.floor(i/9),12);for(let n=0;n<count;n++)particles.push({x,y,vx:(Math.random()-.5)*55,vy:-15-Math.random()*45,life:1,max:1,color});if(text)particles.push({x,y:y-16,vx:0,vy:-18,life:1.5,max:1.5,color,text});particles=particles.slice(-550);}
function resize(){const r=$('world').getBoundingClientRect();w=r.width;h=r.height;const d=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);transform();}
function transform(){const top=h<450?60:110;scale=Math.max(.35,Math.min(w/(w<700?275:460),(h-top-30)/250))*zoom;ox=w/2+panX;oy=(h+top)/2-96*scale+panY;}
function render(now,dt){transform();ctx.fillStyle=isNight?'#193441':'#234956';ctx.fillRect(0,0,w,h);for(let i=0;i<16;i++){let x=((i*83+(reduced?0:now*.005))%(w+80))-40,y=(i*53)%(h||1);line([x,y],[x+16+Math.sin(i)*7,y],'#a2d3cb13',1);}ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);let sorted=Array.from({length:81},(_,i)=>i).sort((a,b)=>(a%9+Math.floor(a/9))-(b%9+Math.floor(b/9)));
 for(let i of sorted){const t=state.g[i];if(t.t==='water')continue;const x=i%9,y=Math.floor(i/9);box(x,y,1,1,9,[['#9bb490','#91ad8b','#a1b891','#8ba98b'][t.v],'#76917c','#607f73'],-9);face([[x-.495,y-.495,.1],[x+.495,y-.495,.1],[x+.495,y+.495,.1],[x-.495,y+.495,.1]],'#b8dca10a','#d2dfb322');if(i===selected)face([[x-.48,y-.48,1],[x+.48,y-.48,1],[x+.48,y+.48,1],[x-.48,y+.48,1]],'#eaffca44','#eeffd5');}
 for(let i of sorted){let t=state.g[i];if(t.b)building(i,now);else if(t.t==='forest'){tree(i%9-.13,Math.floor(i/9)-.1,.85,t.v);if(t.v%2===0)tree(i%9+.23,Math.floor(i/9)+.23,.55,t.v);}if(buildMode&&i===selected&&!t.b&&t.t!=='water')building(i,now,true);}
 const roads=[...view.net].filter(i=>state.g[i].b==='road');if(roads.length&&!cars.length)for(let j=0;j<5;j++)cars.push({i:roads[j%roads.length],to:null,t:0,col:['#edc784','#eeddd0','#b3dddc','#dca08e','#c4c9e5'][j]});
 if(!reduced)for(let c of cars){if(!view.net.has(c.i)){c.i=roads[0];c.to=null;}if(c.i===undefined)continue;if(c.to===null){const next=near(c.i).filter(j=>view.net.has(j)&&state.g[j].b==='road');if(!next.length)continue;c.to=next[Math.floor(Math.random()*next.length)];}c.t+=dt*.45;const x=(c.i%9)*(1-c.t)+(c.to%9)*c.t,y=Math.floor(c.i/9)*(1-c.t)+Math.floor(c.to/9)*c.t;box(x,y,.19,.12,3,[c.col,'#aeb9aa','#7e9994'],3);if(c.t>=1){c.i=c.to;c.to=null;c.t=0;}}
 for(let p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.text)p.vy+=50*dt;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;if(p.text){ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);}else ctx.fillRect(p.x,p.y,2.4,2.4);}particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;ctx.restore();if(isNight){ctx.fillStyle='#15214133';ctx.fillRect(0,0,w,h);}}
function loop(now){requestAnimationFrame(loop);if(document.hidden||now-frame<(reduced?100:32))return;const dt=Math.min(.08,(now-frame)/1000);frame=now;render(now,dt);}
const pointers=new Map();let gesture=null,dist=0;
const local=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
function zoomBy(f){zoom=Math.max(.8,Math.min(2.6,zoom*f));transform();}
function tap(x,y){if(busy||state.phase!=='build'||modalKind)return;if(menuOpen){menuOpen=false;syncPanels();return;}if(drawerOpen){setDrawer(false);return;}const a=(x-ox)/scale,b=(y-oy)/scale,gx=Math.round(a/48+b/24),gy=Math.round(b/24-a/48);selected=gx>=0&&gx<9&&gy>=0&&gy<9?gy*9+gx:-1;if(selected>=0&&!state.g[selected].b&&state.g[selected].t!=='water'&&!buildMode)setDrawer(true);placement();beep(330);}
canvas.addEventListener('pointerdown',e=>{if(e.button&&e.button!==0)return;const p=local(e);pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);if(pointers.size===1)gesture={start:p,last:p,moved:false};else{gesture.moved=true;let a=[...pointers.values()];dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!gesture)return;const p=local(e);pointers.set(e.pointerId,p);if(pointers.size>1){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(dist>1)zoomBy(d/dist);dist=d;}else{if(Math.hypot(p.x-gesture.start.x,p.y-gesture.start.y)>6)gesture.moved=true;if(gesture.moved){panX=Math.max(-w*.8,Math.min(w*.8,panX+p.x-gesture.last.x));panY=Math.max(-h*.8,Math.min(h*.8,panY+p.y-gesture.last.y));}gesture.last=p;}});
function end(e){const p=local(e);if(gesture&&!gesture.moved&&e.type==='pointerup')tap(p.x,p.y);pointers.delete(e.pointerId);if(pointers.size===1){gesture.last=[...pointers.values()][0];gesture.moved=true;}else if(!pointers.size)gesture=null;}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',e=>{pointers.delete(e.pointerId);if(!pointers.size)gesture=null;});canvas.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.1:1/1.1);},{passive:false});

$('cards').onclick=e=>{const b=e.target.closest('[data-type]');if(!b||busy||state.phase!=='build')return;if(!state.unlocked.includes(b.dataset.type))return toast('決算後に設計図を獲得すると建設できます。');type=b.dataset.type;buildMode=true;if(selected>=0&&state.g[selected].b)selected=-1;setDrawer(false);refresh();};
$('selection').onclick=e=>{const b=e.target.closest('[data-action]');if(!b||state.phase!=='build'||busy)return;const a=b.dataset.action;if(a==='cancel')return cancelSelection();if(a==='build')construct();if(a==='upgrade')upgrade();if(a==='inspect'){const k=state.g[selected]?.b||type;modal(B[k].name,'<p>'+B[k].desc+'</p>',closeButton);}if(a==='remove'){const t=state.g[selected];if(!t?.b||t.b==='hall')return;modal('撤去しますか？',`<p>${B[t.b].name}を撤去し、資金${Math.floor(B[t.b].cost*.25)}を回収します。</p>`,'<button class="secondary" data-action="close">戻る</button><button class="primary" data-action="remove-confirm">撤去する</button>');}};
$('modal').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.choice!==undefined)return choose(Number(b.dataset.choice));if(b.dataset.replace!==undefined)return choose(pending,Number(b.dataset.replace));switch(b.dataset.action){case'close':close();break;case'new':newGame();break;case'back':rewardScreen();break;case'skip':if(state.phase==='reward'){state.cash+=15;state.offers=[];state.phase='build';dismiss();selected=-1;refresh();}break;case'continue':state.free=true;state.round++;state.ap=4;state.phase='reward';offers();refresh();rewardScreen();break;case'remove-confirm':{const t=state.g[selected];if(t?.b&&t.b!=='hall'){state.cash+=Math.floor(B[t.b].cost*.25);t.b=null;t.l=1;cars=[];}dismiss();refresh();break;}}};

$('settle').onclick=settle;$('policies').onclick=infoPolicies;$('history').onclick=history;$('forecast').onclick=history;
$('plus').onclick=()=>zoomBy(1.2);$('minus').onclick=()=>zoomBy(1/1.2);$('center').onclick=()=>{zoom=1;panX=panY=0;menuOpen=false;syncPanels();transform();};

$('goal-btn').onclick=()=>{const stage=Math.min(2,Math.floor((state.round-1)/4));modal(state.free?'自由建設':['最初の都市審査','産業振興の審査','最後の都市審査'][stage],`<p>${state.free?'ターン制限なし':(4-(state.round-1)%4)+'ターン以内に繁栄度 '+fmt(TARGETS[stage])+' が目標です。'}</p><div class="big">${fmt(state.score)}</div><p>行動力 ${state.ap} · 次の収益 +${fmt(view.income)}<br>${view.event[0]}${view.event[1]?'：'+B[view.event[1]].name+' ×'+view.event[2]:''}</p>`,closeButton);};
$('help').onclick=()=>modal('遊び方','<p>上部の「＋」から建物を選び、土地をタップして建設します。住宅と公園、商店と住宅を隣接させると収益が増えます。</p><p>行動力は毎ターン4。道路は行動力不要です。建物は役場につながる道路に隣接すると稼働します。</p><p>「決算」で収益・繁栄度を獲得し、3択の報酬を選びます。4・8・12ターンの目標は累計220・850・2,000です。</p><p>建物をタップすると改築・撤去、建物名をタップすると効果を確認できます。地図はドラッグで移動、ピンチで拡大できます。</p>',closeButton);
$('reset').onclick=()=>{if(busy)return;modal('新しい街を開拓しますか？','<p>現在の街の進行は上書きされます。</p>','<button class="secondary" data-action="close">戻る</button><button class="primary" data-action="new">新しく始める</button>');};
$('overlay').onclick=e=>{if(e.target===$('overlay'))close();};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalKind)close();else{menuOpen=false;cancelSelection();syncPanels();}}if(e.key==='Tab'&&!$('overlay').hidden){const buttons=[...$('modal').querySelectorAll('button:not(:disabled)')];if(!buttons.length)return;let first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe($('world'));if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
